name: Release to PyPI

on:
  push:
    tags:
      # Fire the release on both conventions: `v0.5.0` and `0.5.0`.
      - "v*"
      - "[0-9]*"

permissions:
  contents: read
  id-token: write # trusted publishing (OIDC) — no PyPI token secret required

jobs:
  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio ruff

      - name: Run unit tests
        run: python -m pytest tests/unit

      - name: Run integration tests
        run: python -m pytest tests/integration

  build-and-publish:
    name: Build and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Full history so setuptools-scm (if enabled later) can resolve versions.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      # Trusted Publishing: authenticates via OIDC against the Trusted
      # Publisher configured on pypi.org for this repository
      # (owner magichrist, repo kali-mcp, workflow release.yml).
      # Do NOT add a username/password here — the action would fall back
      # to token auth and fail.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
