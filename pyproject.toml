
[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kmcp"
description = "MCP server exposing Kali Linux penetration-testing tools to AI agents"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{ name = "kali-mcp" }]
dynamic = ["version"]

dependencies = [
    "mcp>=1.26.0,<2",
    "fastmcp>=3.4.10,<4",
    "uvicorn>=0.30.0",
    "python-dotenv",
    "rich",
    "httpx",
]

[project.scripts]
kali-mcp = "kali_mcp.server:main"
kali-mcp-monitor = "kali_mcp.monitor.tui:main"
kmcp = "kali_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kali_mcp = ["studio/web/**/*"]

[tool.setuptools_scm]
write_to = "src/kali_mcp/_version.py"
tag_regex = '^(?:v)?(?P<version>[^\+]+)$'

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "e2e: end-to-end tests that spawn a real server process (deselect with '-m \"not e2e\"')",
]

[tool.ruff]
line-length = 100
