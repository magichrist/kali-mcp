id: incident_response
name: Incident Response Assessment
description: Targeted incident response validation — scope check, evidence collection, finding recheck, and correlation
parameters:
  target:
    type: string
    description: Target host or URL involved in the incident
    required: true
  finding_ids:
    type: array
    description: List of finding identifiers to revalidate
    default: []
  severity_threshold:
    type: string
    description: "Minimum severity to include: critical | high | medium | low | informational"
    default: medium
playbook_definition:
  name: incident_response
  version: "2.0.0"
  inputs:
    target: "{{target}}"
    finding_ids: "{{finding_ids}}"
    severity_threshold: "{{severity_threshold}}"
  execution:
    max_parallel: 2
    timeout: 600
    resume: true
  steps:
    - id: validate
      type: scope_check
      depends_on: []
      args:
        target: "{{target}}"
      checkpoint: true
    - id: evidence_collection
      tool: generic_command
      type: tool
      depends_on: [validate]
      args:
        target: "{{target}}"
        command: "echo INCIDENT_EVIDENCE; date -u; hostname; uname -a; ss -tulnp 2>/dev/null || netstat -tulnp 2>/dev/null || true"
        timeout: 60
    - id: finding_recheck
      type: custom
      depends_on: [validate]
      args:
        target: "{{target}}"
        finding_ids: "{{finding_ids}}"
        severity_threshold: "{{severity_threshold}}"
    - id: correlate
      type: finding_correlation
      depends_on: [evidence_collection, finding_recheck]
      checkpoint: true
    - id: report
      type: assessment_report
      depends_on: [correlate]
