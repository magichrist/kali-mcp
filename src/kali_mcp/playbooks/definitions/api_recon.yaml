id: api_recon
name: "API Reconnaissance & Assessment"
description: "API discovery and security assessment — crawl endpoints, discover parameters, enumerate directories, scan for API vulnerabilities, correlate findings, and report."
version: "2.0.0"
inputs:
  target:
    type: string
    required: true
    description: "Target URL or base API endpoint (e.g. https://api.example.com)"
  options:
    type: object
    description: "Optional assessment options"
    properties:
      auth_token:
        type: string
        description: "Bearer/API authentication token"
      api_spec:
        type: string
        description: "OpenAPI/Swagger spec path or URL"
execution:
  max_parallel: 3
  timeout: 900
  resume: true
steps:
  - id: validate
    type: scope_check
    depends_on: []
    checkpoint: true
    description: "Validate target against active assessment scope"
  - id: api_discovery
    module: api_discovery
    depends_on: [validate]
    inputs:
      target: "{{target}}"
      auth_token: "{{options.auth_token}}"
      api_spec: "{{options.api_spec}}"
    output_mapping:
      endpoints: api_discovery.endpoints
    checkpoint: true
    description: "Discover API endpoints via katana crawling"
  - id: param_discovery
    module: param_discovery
    depends_on: [api_discovery]
    inputs:
      target: "{{target}}"
      endpoints: "{{api_discovery.endpoints}}"
    parallel: true
    checkpoint: true
    description: "Discover hidden request parameters via arjun"
  - id: api_dir_enum
    module: api_dir_enum
    depends_on: [api_discovery]
    inputs:
      target: "{{target}}"
    parallel: true
    checkpoint: true
    description: "Enumerate API directories and paths via ffuf"
  - id: api_vuln_scan
    module: api_vuln_scan
    depends_on: [api_discovery, param_discovery, api_dir_enum]
    inputs:
      target: "{{target}}"
      endpoints: "{{api_discovery.endpoints}}"
      parameters: "{{param_discovery.parameters}}"
    checkpoint: true
    description: "Scan API endpoints with nuclei API templates"
  - id: correlate
    type: finding_correlation
    depends_on: [param_discovery, api_dir_enum, api_vuln_scan]
    checkpoint: true
    description: "Deduplicate and correlate findings across tools"
  - id: report
    type: assessment_report
    depends_on: [correlate]
    description: "Generate the assessment report"
outputs:
  - assessment_id
  - findings
  - assets
  - artifacts
  - next_actions
  - recommended_next_playbooks
