id: custom_recon
name: Custom Reconnaissance
description: User-defined custom recon — run a list of custom modules against a target, correlate findings, and report.
version: "2.0.0"
inputs:
  target:
    type: string
    required: true
    description: Target to assess
  custom_modules:
    type: array
    description: List of module IDs to execute against the target
    default: []
execution:
  max_parallel: 4
  timeout: 600
  resume: true
steps:
  - id: validate
    type: scope_check
    depends_on: []
    checkpoint: true
    description: Validate target against active assessment scope
  - id: custom_modules
    module: host_enumeration
    depends_on: [validate]
    foreach: "custom_modules"
    inputs:
      target: "{{target}}"
    checkpoint: true
    description: Execute each user-defined module against the target
  - id: correlate
    type: finding_correlation
    depends_on: [custom_modules]
    checkpoint: true
    description: Deduplicate and correlate findings across custom modules
  - id: report
    type: assessment_report
    depends_on: [correlate]
    description: Generate the custom recon report
outputs:
  - assessment_id
  - findings
  - assets
  - artifacts
  - next_actions
  - recommended_next_playbooks
