id: network_assessment
name: "Network Assessment"
description: "Network and service inventory — port scan, host resolution, service enumeration, and correlation."
version: "2.0.0"
inputs:
  target:
    type: string
    required: true
    description: "Target host or network to assess"
  options:
    type: object
    description: "Optional assessment options"
    properties:
      ports:
        type: string
        description: "Port range to scan"
        default: "1-1000"
      rate:
        type: string
        description: "Packet rate"
        default: "500"
execution:
  max_parallel: 3
  timeout: 900
  resume: true
steps:
  - id: validate
    type: scope_check
    depends_on: []
    checkpoint: true
    description: "Validate target against active assessment scope"
  - id: discover
    module: nmap
    depends_on: [validate]
    args:
      target: "{{target}}"
      ports: "{{options.ports}}"
    checkpoint: true
    description: "Discover open ports and services via nmap"
  - id: resolve
    module: resolve
    depends_on: [discover]
    args:
      target: "{{target}}"
    checkpoint: true
    description: "Resolve discovered hosts to live services"
  - id: ports
    module: ports
    depends_on: [discover]
    args:
      target: "{{target}}"
      ports: "{{options.ports}}"
      rate: "{{options.rate}}"
    parallel: true
    checkpoint: true
    description: "Enumerate ports via the ports module (nmap)"
  - id: enumerate
    module: nmap
    depends_on: [resolve, ports]
    args:
      target: "{{target}}"
      ports: "{{options.ports}}"
      extra_args: "-sV -sC"
    checkpoint: true
    description: "Service and version enumeration on resolved hosts"
  - id: correlate
    type: finding_correlation
    depends_on: [enumerate, resolve, ports]
    checkpoint: true
    description: "Deduplicate and correlate network findings"
  - id: report
    type: assessment_report
    depends_on: [correlate]
    description: "Generate the network assessment report"
outputs:
  - assessment_id
  - findings
  - assets
  - artifacts
  - next_actions
  - recommended_next_playbooks
