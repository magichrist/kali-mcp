id: web_assessment
name: "Web Application Assessment"
description: "Web application security assessment — subdomain discovery, HTTP resolution, crawling, parameter/directory discovery, and vulnerability scanning, then correlation and report."
version: "2.0.0"
inputs:
  target:
    type: string
    required: true
    description: "Target URL or domain to assess"
  options:
    type: object
    description: "Optional assessment options"
    properties:
      wordlist:
        type: string
        description: "Wordlist for ffuf directory brute-forcing"
        default: "/usr/share/wordlists/dirb/common.txt"
execution:
  max_parallel: 4
  timeout: 900
  resume: true
steps:
  - id: validate
    type: scope_check
    depends_on: []
    checkpoint: true
    description: "Validate target against active assessment scope"
  - id: discover
    type: tool
    tool: subfinder
    depends_on: [validate]
    args:
      domain: "{{target}}"
      timeout: 300
    checkpoint: true
    description: "Discover subdomains via subfinder"
  - id: resolve
    type: tool
    tool: httpx
    depends_on: [discover]
    args:
      target: "{{target}}"
      timeout: 300
    checkpoint: true
    description: "Resolve hosts to live HTTP services"
  - id: map
    type: tool
    tool: katana
    depends_on: [resolve]
    when: "resolve.http_services_count > 0"
    args:
      target: "{{target}}"
      timeout: 300
    checkpoint: true
    description: "Crawl the application with katana"
  - id: params
    type: tool
    tool: arjun
    depends_on: [map]
    args:
      target: "{{target}}"
      timeout: 300
    parallel: true
    checkpoint: true
    description: "Discover hidden request parameters via arjun"
  - id: dirs
    type: tool
    tool: ffuf
    depends_on: [map]
    args:
      target: "{{target}}"
      wordlist: "{{options.wordlist}}"
      timeout: 300
    parallel: true
    checkpoint: true
    description: "Brute-force directories and paths via ffuf"
  - id: vulnerability_checks
    type: tool
    tool: nuclei
    depends_on: [params, dirs]
    args:
      target: "{{target}}"
      templates: "http"
      timeout: 600
    checkpoint: true
    description: "Scan web endpoints with nuclei"
  - id: correlate
    type: finding_correlation
    depends_on: [params, dirs, vulnerability_checks]
    checkpoint: true
    description: "Deduplicate and correlate web findings"
  - id: report
    type: assessment_report
    depends_on: [correlate]
    description: "Generate the web assessment report"
outputs:
  - assessment_id
  - findings
  - assets
  - artifacts
  - next_actions
  - recommended_next_playbooks
