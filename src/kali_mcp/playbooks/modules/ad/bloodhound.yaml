id: bloodhound
name: "BloodHound"
description: "Active Directory graph data collection via BloodHound"
tool: bloodhound
timeout: 300
inputs:
  domain:
    type: string
    required: true
    description: "AD domain name"
  collection:
    type: string
    description: "Collection methods"
    default: "All"
  extra_args:
    type: string
    description: "Extra BloodHound arguments"
    default: ""
outputs:
  - assets
  - relationships
