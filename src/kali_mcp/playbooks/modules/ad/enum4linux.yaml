id: enum4linux
name: "Enum4linux"
description: "Active Directory enumeration via enum4linux"
tool: enum4linux
timeout: 300
inputs:
  target:
    type: string
    required: true
    description: "Target domain controller or Windows host"
  extra_args:
    type: string
    description: "Extra enum4linux arguments"
    default: ""
outputs:
  - domain_info
  - users
  - groups
  - shares
