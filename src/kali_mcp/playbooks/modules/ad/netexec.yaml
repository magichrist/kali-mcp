id: netexec
name: "NetExec"
description: "Authenticated network enumeration via netexec (nxc)"
tool: netexec
timeout: 300
inputs:
  target:
    type: string
    required: true
    description: "Target host or network"
  protocol:
    type: string
    required: true
    description: "Protocol (smb, ldap, rdp, ...)"
    default: "smb"
  extra_args:
    type: string
    description: "Extra netexec arguments"
    default: ""
outputs:
  - hosts
  - credentials
