id: cloud_discovery
name: Cloud Asset Discovery
description: List cloud resources via provider APIs AWS Azure Gcp
tool: generic_command
timeout: 600
inputs:
  target:
    type: string
    required: true
    description: Cloud account ID subscription project or region to assess
  provider:
    type: string
    description: Cloud provider aws azure gcp
    default: aws
  credentials:
    type: string
    description: Credentials reference or profile name
outputs:
  - resources
  - regions
  - accounts
