id: image_scan
name: Container Image Scan
description: Scan a container image for vulnerabilities and misconfigurations via trivy or grype
tool: generic_command
timeout: 600
inputs:
  target:
    type: string
    required: true
    description: Container image name or digest
  docker_host:
    type: string
    description: Docker host URI
  scanner:
    type: string
    description: Scanner to use trivy or grype
    default: trivy
outputs:
  - vulnerabilities
  - image_metadata
