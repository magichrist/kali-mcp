id: host_enumeration
name: Linux Host Enumeration
description: Enumerate OS packages users and running services on a Linux host
tool: generic_command
timeout: 300
inputs:
  target:
    type: string
    required: true
    description: Target host IP or localhost for local enumeration
  ssh_key:
    type: string
    description: Optional SSH private key for remote enumeration
  sudo_password:
    type: string
    description: Optional sudo password for privileged commands
  command:
    type: string
    description: Enumeration command default runs uname packages users services
    default: uname -a; echo PACKAGES; (dpkg -l || rpm -qa) | head -50; echo USERS; getent passwd; echo SERVICES; systemctl list-units --type=service --state=running || service --status-all
outputs:
  - os_info
  - packages
  - users
  - services
