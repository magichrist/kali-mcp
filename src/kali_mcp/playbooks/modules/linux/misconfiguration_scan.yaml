id: misconfiguration_scan
name: Linux Misconfiguration Scan
description: Scan for insecure file permissions SSH config issues and firewall misconfigurations
tool: generic_command
timeout: 300
inputs:
  target:
    type: string
    required: true
    description: Target host IP or localhost
  ssh_key:
    type: string
    description: Optional SSH private key
  sudo_password:
    type: string
    description: Optional sudo password
  command:
    type: string
    description: Misconfiguration scan command default checks SSH config file perms firewall
    default: echo SSH_CONFIG; grep -v '^#' /etc/ssh/sshd_config 2>/dev/null | grep -v '^$' || true; echo WORLD_WRITABLE; find /etc /var -xdev -type f -perm /o+w 2>/dev/null | head -30; echo FIREWALL; ufw status || iptables -L || nft list ruleset || true
outputs:
  - ssh_issues
  - file_permission_issues
  - firewall_issues
