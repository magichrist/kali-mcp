id: masscan
name: "Masscan"
description: "High-speed port scanning via masscan"
tool: masscan
timeout: 600
inputs:
  target:
    type: string
    required: true
    description: "Target host or network"
  ports:
    type: string
    description: "Port range"
    default: "1-1000"
  rate:
    type: string
    description: "Packet rate"
    default: "1000"
outputs:
  - open_ports
