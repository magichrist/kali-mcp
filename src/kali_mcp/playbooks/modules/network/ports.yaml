id: ports
name: "Port & Service Enumeration"
description: "Discover open ports and services on a target (nmap)"
tool: nmap
timeout: 600
inputs:
  target:
    type: string
    required: true
    description: "Target host or network to scan"
  ports:
    type: string
    description: "Port ranges or list to scan"
    default: "1-1000"
  rate:
    type: string
    description: "Packet rate (e.g. 1000)"
    default: "500"
outputs:
  - open_ports
  - open_ports_count
  - services
