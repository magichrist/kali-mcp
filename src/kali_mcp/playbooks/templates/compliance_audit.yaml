id: compliance_audit
name: Compliance Audit
description: Linux host compliance audit — host enumeration, privilege checks, and misconfiguration scanning against a benchmark
parameters:
  target:
    type: string
    description: Target host IP or localhost
    required: true
  benchmark:
    type: string
    description: Compliance benchmark to audit against
    default: cis
  sudo_password:
    type: string
    description: Optional sudo password for privileged checks
playbook_definition:
  name: compliance_audit
  version: "2.0.0"
  inputs:
    target: "{{target}}"
    benchmark: "{{benchmark}}"
    sudo_password: "{{sudo_password}}"
  execution:
    max_parallel: 2
    timeout: 600
    resume: true
  steps:
    - id: validate
      type: scope_check
      depends_on: []
      args:
        target: "{{target}}"
      checkpoint: true
    - id: host_enumeration
      tool: generic_command
      type: tool
      depends_on: [validate]
      args:
        target: "{{target}}"
        command: "uname -a; echo PACKAGES; (dpkg -l || rpm -qa) | head -50; echo USERS; getent passwd; echo SERVICES; systemctl list-units --type=service --state=running || service --status-all"
        timeout: 120
    - id: privilege_check
      tool: generic_command
      type: tool
      depends_on: [validate]
      args:
        target: "{{target}}"
        command: "echo SUDO; sudo -l || true; echo SUID; find / -perm /4000 -type f 2>/dev/null | head -50; echo CAPABILITIES; getcap -r / 2>/dev/null | head -50 || true"
        timeout: 120
      parallel: true
    - id: misconfiguration_scan
      tool: generic_command
      type: tool
      depends_on: [host_enumeration, privilege_check]
      args:
        target: "{{target}}"
        command: "echo SSH_CONFIG; grep -v '^#' /etc/ssh/sshd_config 2>/dev/null | grep -v '^$' || true; echo WORLD_WRITABLE; find /etc /var -xdev -type f -perm /o+w 2>/dev/null | head -30; echo FIREWALL; ufw status || iptables -L || nft list ruleset || true"
        timeout: 120
    - id: correlate
      type: finding_correlation
      depends_on: [host_enumeration, privilege_check, misconfiguration_scan]
      checkpoint: true
    - id: report
      type: assessment_report
      depends_on: [correlate]
