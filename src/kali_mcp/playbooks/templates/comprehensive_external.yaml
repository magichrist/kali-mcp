id: comprehensive_external
name: Comprehensive External Assessment
description: Broad external attack surface assessment — DNS, HTTP, ports, technologies, crawling, and vulnerability scanning
parameters:
  target:
    type: string
    description: Target domain or IP to assess
    required: true
  include_vuln_scan:
    type: boolean
    description: Include nuclei vulnerability scan
    default: true
playbook_definition:
  name: comprehensive_external
  version: "2.0.0"
  inputs:
    target: "{{target}}"
    include_vuln_scan: "{{include_vuln_scan}}"
  execution:
    max_parallel: 4
    timeout: 900
    resume: true
  steps:
    - id: validate
      type: scope_check
      depends_on: []
      args:
        target: "{{target}}"
      checkpoint: true
    - id: subfinder
      tool: subfinder
      type: tool
      depends_on: [validate]
      args:
        target: "{{target}}"
        timeout: 180
    - id: amass
      tool: amass
      type: tool
      depends_on: [validate]
      args:
        target: "{{target}}"
        timeout: 180
      parallel: true
    - id: httpx
      tool: httpx
      type: tool
      depends_on: [subfinder, amass]
      args:
        target: "{{target}}"
        timeout: 180
    - id: nmap
      tool: nmap
      type: tool
      depends_on: [validate]
      args:
        target: "{{target}}"
        scan_type: "-sV"
        timeout: 300
      parallel: true
    - id: katana
      tool: katana
      type: tool
      depends_on: [httpx]
      when: "httpx.http_services_count > 0"
      args:
        target: "{{target}}"
        timeout: 240
    - id: nuclei
      tool: nuclei
      type: tool
      depends_on: [httpx]
      when: "include_vuln_scan == true"
      args:
        target: "{{target}}"
        timeout: 400
    - id: correlate
      type: finding_correlation
      depends_on: [subfinder, amass, httpx, nmap, katana, nuclei]
      checkpoint: true
    - id: report
      type: assessment_report
      depends_on: [correlate]
