<section class="pagehead">
  <div class="page-top">
    <div>
      <div class="eyebrow">PLAYBOOK STUDIO</div>
      <h1>Playbooks</h1>
      <div class="subtitle">Manage and edit playbooks from the backend.</div>
    </div>
    <div class="head-right">
      <button class="btn ghost" id="refreshBtn">↻ &nbsp;Refresh</button>
      <button class="btn primary" id="newPlaybookBtn">＋ &nbsp;New</button>
    </div>
  </div>
</section>
<section class="studio-grid">
  <aside class="playbook-list" id="playbookList">Loading…</aside>
  <section class="editor">
    <div class="panel-head">
      <span id="editorTitle">Select a playbook</span>
      <span id="editorStatus"></span>
    </div>
    <textarea class="code-area" id="dslCode" spellcheck="false" placeholder="Playbook definition (JSON/YAML)…"></textarea>
    <div class="editor-actions">
      <button class="btn" id="validateBtn">✓ &nbsp;Validate</button>
      <button class="btn" id="saveBtn">Save</button>
      <button class="btn primary" id="publishBtn">Publish</button>
    </div>
    <pre class="result" id="result"></pre>
  </section>
</section>
