id: external_recon
name: "External Reconnaissance"
description: "External attack surface discovery — subdomain discovery, HTTP resolution, port scanning, technology fingerprinting, and vulnerability scanning, then correlation and report."
version: "2.0.0"
inputs:
  target:
    type: string
    required: true
    description: "Target domain or IP to assess"
  options:
    type: object
    description: "Optional assessment options"
    properties:
      ports:
        type: string
        description: "Port range for nmap/masscan"
        default: "1-1000"
execution:
  max_parallel: 3
  timeout: 900
  resume: true
steps:
  - id: validate
    type: scope_check
    depends_on: []
    checkpoint: true
    description: "Validate target against active assessment scope"
  - id: discover
    module: subfinder
    depends_on: [validate]
    args:
      domain: "{{target}}"
    checkpoint: true
    description: "Discover subdomains via subfinder"
  - id: resolve
    module: httpx
    depends_on: [discover]
    args:
      target: "{{target}}"
    checkpoint: true
    description: "Resolve hosts to live HTTP services"
  - id: ports
    module: nmap
    depends_on: [validate]
    args:
      target: "{{target}}"
      ports: "{{options.ports}}"
    parallel: true
    checkpoint: true
    description: "Enumerate open ports via nmap"
  - id: technologies
    module: whatweb
    depends_on: [resolve]
    args:
      target: "{{target}}"
    parallel: true
    checkpoint: true
    description: "Fingerprint technologies on resolved services"
  - id: vulnerability_checks
    module: nuclei
    depends_on: [technologies, resolve]
    args:
      target: "{{target}}"
      templates: "http"
    checkpoint: true
    description: "Scan resolved services with nuclei"
  - id: correlate
    type: finding_correlation
    depends_on: [technologies, vulnerability_checks, ports]
    checkpoint: true
    description: "Deduplicate and correlate findings across tools"
  - id: report
    type: assessment_report
    depends_on: [correlate]
    description: "Generate the external recon report"
outputs:
  - assessment_id
  - findings
  - assets
  - artifacts
  - next_actions
  - recommended_next_playbooks
