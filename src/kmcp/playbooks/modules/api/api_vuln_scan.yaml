id: api_vuln_scan
name: "API Vulnerability Scan"
description: "Scan API endpoints with nuclei API/security templates"
tool: nuclei
timeout: 600
inputs:
  target:
    type: string
    required: true
    description: "Target URL or base API endpoint"
  endpoints:
    type: array
    description: "Discovered API endpoints to scan"
  parameters:
    type: array
    description: "Discovered parameters to inject (from param_discovery)"
  templates:
    type: string
    description: "Optional nuclei template directory or tag (default: api)"
    default: "api"
outputs:
  - findings
  - vulnerable_endpoints
