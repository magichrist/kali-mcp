id: config_posture_check
name: Cloud Configuration Posture Check
description: Check cloud configuration against CIS benchmarks open S3 buckets public security groups
tool: generic_command
timeout: 600
inputs:
  target:
    type: string
    required: true
    description: Cloud account subscription project to assess
  provider:
    type: string
    description: Cloud provider aws azure gcp
    default: aws
  credentials:
    type: string
    description: Credentials reference or profile name
  benchmark:
    type: string
    description: Benchmark to run default cis
    default: cis
outputs:
  - posture_failures
  - open_buckets
  - public_security_groups
  - compliance_score
