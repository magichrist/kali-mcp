id: runtime_check
name: Container Runtime Check
description: Check running containers for escapes, privileged modes, and runtime risks
tool: generic_command
timeout: 300
inputs:
  target:
    type: string
    required: true
    description: Container ID or 'all' for all running containers
  docker_host:
    type: string
    description: Optional Docker host URI (e.g. unix:///var/run/docker.sock)
outputs:
  - running_containers
  - privileged_containers
  - escape_risk_indicators
