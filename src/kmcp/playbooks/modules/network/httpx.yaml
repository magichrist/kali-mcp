id: httpx
name: "HTTPX"
description: "HTTP service probing and resolution via httpx"
tool: httpx
timeout: 300
inputs:
  target:
    type: string
    required: true
    description: "Host, domain, or URL to probe"
  timeout:
    type: integer
    description: "Per-target timeout in seconds"
    default: 30
outputs:
  - resolved_hosts
  - http_services
  - http_services_count
