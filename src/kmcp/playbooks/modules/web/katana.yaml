id: katana
name: "Katana"
description: "Web crawling and endpoint discovery via katana"
tool: katana
timeout: 300
inputs:
  target:
    type: string
    required: true
    description: "Target URL or domain"
  depth:
    type: integer
    description: "Crawl depth"
    default: 2
  extra_args:
    type: string
    description: "Extra katana arguments"
    default: ""
outputs:
  - endpoints
  - assets
