id: whatweb
name: "WhatWeb"
description: "Technology fingerprinting via whatweb"
tool: whatweb
timeout: 300
inputs:
  target:
    type: string
    required: true
    description: "Target URL or host"
  aggression:
    type: integer
    description: "Aggression level"
    default: 3
  extra_args:
    type: string
    description: "Extra whatweb arguments"
    default: ""
outputs:
  - technologies
